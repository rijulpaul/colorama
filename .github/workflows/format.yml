name: Format Check & Apply

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bunx prettier --check "**/*.{ts,tsx,md}"

  format-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bunx prettier --write "**/*.{ts,tsx,md}"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format"
